name: User Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - "User-Service/**"
      - ".github/workflows/user-service-ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "User-Service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_db
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: User-Service
        run: mvn clean package -DskipTests

      - name: Run Tests
        working-directory: User-Service
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-test-results
          path: User-Service/target/surefire-reports/

      - name: Build Docker Image
        working-directory: User-Service
        run: docker build -t user-service:latest .

      - name: Print Build Success
        run: echo "✅ User Service built and tested successfully!"