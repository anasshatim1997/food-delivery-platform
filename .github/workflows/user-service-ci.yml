name: User Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - "User-Service/**"
      - ".github/workflows/user-service-ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "User-Service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: User-Service
        run: mvn clean package -DskipTests

      - name: Run Tests
        working-directory: User-Service
        run: mvn test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-test-results
          path: User-Service/target/surefire-reports/

      - name: Build Docker Image
        working-directory: User-Service
        run: docker build -t user-service:latest .

      - name: Print Build Success
        run: echo "✅ User Service built and tested successfully!"
