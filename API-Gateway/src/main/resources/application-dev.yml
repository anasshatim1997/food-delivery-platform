server:
  port: 8000

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 3s
        capacity: 256

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG