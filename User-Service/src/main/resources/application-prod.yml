spring:
  config:
    activate:
      on-profile: prod

  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: ${HOSTNAME:user-service}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}

app:
  base-url: ${APP_BASE_URL}

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

oauth:
  google:
    userinfo-url: ${OAUTH_GOOGLE_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
    token-info-url: ${OAUTH_GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
    client-id: ${OAUTH_GOOGLE_CLIENT_ID}
  facebook:
    userinfo-url: ${OAUTH_FACEBOOK_USERINFO_URL:https://graph.facebook.com/me?fields=id,name,email,first_name,last_name}
    app-id: ${OAUTH_FACEBOOK_APP_ID}
    app-secret: ${OAUTH_FACEBOOK_APP_SECRET}
    debug-token-url: ${OAUTH_FACEBOOK_DEBUG_TOKEN_URL:https://graph.facebook.com/debug_token}

storage:
  local:
    upload-dir: ${STORAGE_UPLOAD_DIR:/var/app/uploads}
    base-url: ${STORAGE_BASE_URL}