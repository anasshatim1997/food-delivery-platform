spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

eureka:
  client:
    enabled: false
