spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

security:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTNTEy
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

app:
  base-url: http://localhost:8001

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

oauth:
  google:
    userinfo-url: http://localhost:9999/mock/google
    token-info-url: http://localhost:9999/mock/google/tokeninfo
    client-id: test-google-client-id
  facebook:
    userinfo-url: http://localhost:9999/mock/facebook
    app-id: test-facebook-app-id
    app-secret: test-facebook-app-secret
    debug-token-url: http://localhost:9999/mock/facebook/debug_token

storage:
  local:
    upload-dir: target/test-uploads
    base-url: http://localhost:8001/files