spring:
  config:
    activate:
      on-profile: dev

  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: 1234
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ahatim1997@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8001

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

security:
  jwt:
    secret: Os3a29advToFkbd+wFsfPhIfdVtnghVP9IewK1sbDqCWX/7nCPgZIKx9qjeAw9ZEbxx0q6wQBoX52pr404zkQQ==
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

app:
  base-url: http://localhost:8001

logging:
  level:
    root: INFO
    org.springframework.mail: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

oauth:
  google:
    userinfo-url: https://www.googleapis.com/oauth2/v3/userinfo
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    client-id: ${OAUTH_GOOGLE_CLIENT_ID}
  facebook:
    userinfo-url: https://graph.facebook.com/me?fields=id,name,email,first_name,last_name
    app-id: ${OAUTH_FACEBOOK_APP_ID}
    app-secret: ${OAUTH_FACEBOOK_APP_SECRET}
    debug-token-url: https://graph.facebook.com/debug_token

storage:
  local:
    upload-dir: uploads
    base-url: http://localhost:8001/files