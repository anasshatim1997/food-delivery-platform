spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: 1234
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8001
  servlet:
    context-path: /api

security:
  jwt:
    secret: Os3a29advToFkbd+wFsfPhIfdVtnghVP9IewK1sbDqCWX/7nCPgZIKx9qjeAw9ZEbxx0q6wQBoX52pr404zkQQ==
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

logging:
  level:
    root: INFO